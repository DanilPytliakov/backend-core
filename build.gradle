plugins {
    id 'java'
    id 'application'
    id 'checkstyle'
    id 'jacoco'
    id 'gg.jte.gradle' version '3.1.15'
    id 'org.springframework.boot' version '3.5.0'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'com.diffplug.spotless' version '7.2.1'
    id 'org.openapi.generator' version '7.1.0'
}

group = 'ru.mentee.power'
version = '1.0-SNAPSHOT'

ext {
    junitVersion = '5.10.0' // или новее
    assertjVersion = '3.25.3'
    mapstructVersion = '1.6.3'
    lombokMapstructBindingVersion = '0.2.0'
    servletVersion = '6.1.0' // Tomcat 11 / Servlet 6 актуальны для SB 4
    tomcatVersion = '11.0.1'
    jteVersion = '3.1.15'
    validationApiVersion = '3.1.0'
    hibernateValidatorVersion = '8.0.1.Final'
    // Align Spring Cloud starters (e.g., OpenFeign) with Spring Boot version.
    springCloudVersion = '2025.0.0'
    // Resilience4j Spring Boot 3 integration (annotations @Retry, etc.)
    resilience4jVersion = '2.4.0'
    // OpenAPI и документация (Sprint 8)
    openApiGeneratorVersion = '7.1.0'
    springdocVersion = '2.3.0'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25) // Оставляем Java 25
    }
}

application {
    mainClass = 'ru.mentee.power.crm.Main'
}

repositories {
    mavenCentral()
}

dependencyManagement {
    imports {
        mavenBom "org.springframework.cloud:spring-cloud-dependencies:${springCloudVersion}"
        mavenBom "io.github.resilience4j:resilience4j-bom:${resilience4jVersion}"
    }
}

dependencies {
    // Spring Boot.
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-aop'
    implementation 'io.github.resilience4j:resilience4j-spring-boot3'
    implementation 'org.springframework.cloud:spring-cloud-starter-openfeign'

    // Spring Boot Starter Validation (Jakarta Bean Validation + Hibernate Validator)
    implementation "org.springframework.boot:spring-boot-starter-validation"

    // JTE
    implementation "gg.jte:jte:${jteVersion}"
    implementation "gg.jte:jte-runtime:${jteVersion}"
    implementation "gg.jte:jte-spring-boot-starter-3:${jteVersion}"

    // Servlet & Tomcat (если они действительно нужны явно, Spring Boot обычно тянет их сам)
    implementation "jakarta.servlet:jakarta.servlet-api:${servletVersion}"
    implementation "org.apache.tomcat.embed:tomcat-embed-core:${tomcatVersion}"

    // Тесты
    testImplementation platform("org.junit:junit-bom:${junitVersion}")
    testImplementation "org.junit.jupiter:junit-jupiter"
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testImplementation "org.assertj:assertj-core:${assertjVersion}"
    testImplementation 'org.mockito:mockito-core:5.21.0'
    testImplementation 'org.mockito:mockito-junit-jupiter:5.21.0'

    // Bean Validation
    implementation "jakarta.validation:jakarta.validation-api:${validationApiVersion}"
    implementation "org.hibernate.validator:hibernate-validator:${hibernateValidatorVersion}"

    // Lamboock
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'
    implementation "org.projectlombok:lombok-mapstruct-binding:${lombokMapstructBindingVersion}"
    implementation "org.mapstruct:mapstruct:${mapstructVersion}"
    annotationProcessor "org.mapstruct:mapstruct-processor:${mapstructVersion}"
    testCompileOnly 'org.projectlombok:lombok'
    testAnnotationProcessor 'org.projectlombok:lombok'

    // PostgreSQL JDBC Driver (для dev и production)
    runtimeOnly 'org.postgresql:postgresql'

    // H2 Database (только для тестов)
    testRuntimeOnly 'com.h2database:h2:2.3.232'

    // Testing
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.assertj:assertj-core:3.24.2'

    // Liquidbase
    implementation 'org.liquibase:liquibase-core'

    // WireMock для интеграционных тестов внешних API
    testImplementation 'org.wiremock:wiremock-standalone:3.4.2'

    //OpenAPI документация
    implementation "org.springdoc:springdoc-openapi-starter-webmvc-ui:${springdocVersion}"
    implementation 'org.openapitools:jackson-databind-nullable:0.2.6'
}

openApiGenerate {
    generatorName = "spring"
    inputSpec = "${rootProject.projectDir}/src/main/resources/api/api-spec.yaml"
    outputDir = "${buildDir}/generated"
    apiPackage = "ru.mentee.power.crm.spring.rest.generated"
    modelPackage = "ru.mentee.power.crm.spring.dto.generated"
    configOptions = [
            interfaceOnly: "true",
            useTags: "true",
            dateLibrary: "java8",
            useSpringBoot3: "true",
            documentationProvider: "none"
    ]
}

// Добавить сгенерированные файлы в sourceSets
sourceSets {
    main {
        java {
            srcDir "${buildDir}/generated/src/main/java"
        }
    }
}

// Привязать генерацию к компиляции
compileJava.dependsOn tasks.openApiGenerate

tasks.named('compileJava', JavaCompile) {
    options.compilerArgs += [
            '-Amapstruct.defaultComponentModel=spring',
            '-Amapstruct.unmappedTargetPolicy=ERROR'
    ]
}

checkstyle {
    toolVersion = '13.0.0'
    maxErrors = 0
    maxWarnings = 999
}

jacoco {
    toolVersion = '0.8.14' // Оставляем 0.8.14 (с поддержкой Java 25)
}

test {
    useJUnitPlatform()
    finalizedBy jacocoTestReport
}

jacocoTestReport {
    dependsOn test
    reports {
        xml.required = false
        csv.required = false
        html.required = true
        html.outputLocation = layout.buildDirectory.dir('reports/jacoco/test/html')
    }
}

jacocoTestCoverageVerification {
    dependsOn jacocoTestReport
    violationRules {
        rule {
            limit {
                minimum = 0.65
            }
        }
    }
}

check {
    dependsOn jacocoTestCoverageVerification
}

jte {
    sourceDirectory = layout.projectDirectory.dir("src/main/jte").asFile.toPath()
    contentType = "Html"
    binaryStaticContent = false
}

spotless {
    java {
        target 'src/**/*.java'
        targetExclude 'build/**'
        googleJavaFormat('1.35.0')
        removeUnusedImports()
        trimTrailingWhitespace()
        endWithNewline()
    }
}

tasks.named('checkstyleMain') {
    source = source.filter { !it.path.contains('build') }
}

task bootRun8081(type: org.springframework.boot.gradle.tasks.run.BootRun) {
    group = 'application'
    description = 'Run Spring Boot on port 8081'

    mainClass = 'ru.mentee.power.crm.Application'
    classpath = sourceSets.main.runtimeClasspath

    jvmArgs = [
            '--enable-preview',
            '-Dserver.port=8081',
            '-Dspring.profiles.active=dev'
    ]

    args = ['--server.port=8081']
}
