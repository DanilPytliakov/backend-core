server:
  port: 8081

gg:
  jte:
    template-location: src/main/jte
    development-mode: true

spring:
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
    enabled: true
    drop-first: false

  application:
    name: m-crm

  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true

